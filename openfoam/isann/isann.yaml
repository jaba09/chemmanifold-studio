# ISANN criteria (openfoam/isann/README.md). Steps are flow steps (dt 2e-5 s: 50 steps = 1 ms).
seed: 0
parent:                       # a priori model the run starts from (tables for Z/OOD, first warm start)
  data_dir: /opt/ofb/isann/parent_ood7        # its 03_samples (replay), 04_prep, 06_models
  model_file: /opt/ofb/isann/parent_ood7/chemmanifold_model.txt
dedup:
  radius: 0.05                # radius of novelty, in units of the parent's landmark threshold
di:                           # DI phase -> first network
  skip: false                 # true: no DI phase (userChemStep isann.startActive true), the parent
                              #  runs from step 1 and the retrain criteria apply from the start
  min_steps: 100              # 2 ms at least on GA18
  min_pairs: 3000             # deduplicated training pairs
  window: 25                  # steps over which the grid saturation is measured
  saturation: 0.02            # new grid boxes over the window < 2% of all boxes
  max_steps: 400              # 8 ms: train anyway
  min_pairs_forced: 1000
retrain:                      # network phase -> next network
  min_gap: 100                # steps between a published model and the next training
  window: 25
  new_pairs: 1500             # new deduplicated GA18 pairs
  ga18_share: 0.05            # or GA18 share of hot cells above 5% ...
  min_new_pairs: 300          #   ... with at least this many new pairs (also for untrusted bins)
  max_rounds: 12
training:                     # warm-started fine-tuning (07_train.py init_from)
  latent_dim: 12
  epochs: 20
  lr_max: 2.0e-4
  noise_amp: 0.005
  noise_end_frac: 0.4
  pct_start: 0.2
  patience: 5
  threads: 2
  replay_factor: 3            # a priori pairs = 3 x online pairs, clipped to [min, max]
  replay_min: 20000
  replay_max: 60000
  rollout_loss: true
  rollout_weight: 0.5
  online_segments: 4000       # Cantera continuations (8 steps) of online states for the rollout loss
  relabel_dt: false           # true with local time stepping (LTS): pairs whose dt is above the
                              #  trained range are re-integrated (Cantera) over their first sub-step
gate:
  holdout_frac: 0.15          # online pairs never trained on, to accept or reject a candidate
  max_ratio: 1.1              # accept: one-step error below the current one, no more failed
  roll_fail_K: 20             #  rollouts (|dT| > 20 K) and a median rollout error <= 1.1 x
  first_T_mae: 2.0            # K per step: the first network must also be below this
  n_roll: 120
  roll_steps: 100             # 0D rollouts of 2 ms from held-out states vs Cantera
publish:
  steps_ahead: 5              # the control file names a step this far ahead
