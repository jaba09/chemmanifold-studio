# ChemManifold Studio configuration - flow-informed exploration (timescale roadmap, step 4).
# Written by scripts/20_stats_to_config.py from configs/burner_openfoam_ood8.yaml and the flow statistics of
# /opt/ofb/runs/A3_cheap/case @ 4000. Changes (bounds only widened):
#   dt_range: tau_cell p1 9.54e-06 s .. p99.5 0.000224 s (p50 9.17e-05 s)
#   envelope.u_knots: hot-gas mass per Z interval [0.851, 0.098, 0.036, 0.012, 0.004] blended 50/50 with base [0.22, 0.18, 0.22, 0.18, 0.2]
#   pasr.burnt_relaxation.psi_max: psi p99.5 0.561
#   flame.mdot_fuel_min: chi_st p1 0.00245 1/s -> strain 0.0989 1/s < base 0.6 1/s
#   pasr.burnt_relaxation.t_max: burnt-gas age p50 2.96 s (capped at 0.2 s)
#   pasr.burnt_relaxation_lean.t_max: burnt-gas age p50 2.96 s (capped at 0.2 s)
#   MANUAL (sim1, 10 Nov 2026): pasr.burnt_relaxation.psi_max 0.561 -> 0.80. A3 and R2 (OpenFOAM) lack Fluent's
#     DO wall radiation (G1 report, results/sim1/A1/G1.md): the stage 19 psi gate A3 vs R2 failed by +0.04..+0.11, and
#     the corrected Fluent DI flame itself has much more heat loss (hot cells psi p50 0.42, p99 0.758, p99.5 0.767,
#     vs A3 0.10 / 0.546 / 0.561; stage 19 'fluent' on the .dat.h5, data/timescale/fluent_di_corrected). 0.80 covers the
#     Fluent flame. Only these heat-loss statistics are used, no CFD state. All other psi bounds are already >= 0.85
#     (except the ignition seed regimes, 0.15-0.2, left as in ood8).
#   NOTE: the A3 age comes from an LTS solution (pseudo-time), so 2.96 s is not physical; it is capped at 0.2 s as in tix1.
# No CFD state is used as training data; only the statistics above.

data_dir: ../data/openfoam_tix2
seed: 0
chemistry:
  mechanism: mechanisms/ga18.yaml
  fuel: CH4:1.0
  fuel_T: 300.0
  oxidizer: O2:0.232909, N2:0.767091
