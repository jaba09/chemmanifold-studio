# ChemManifold Studio configuration - flow-informed exploration (timescale roadmap, step 4).
# Written by scripts/20_stats_to_config.py from configs/burner_openfoam_ood8.yaml and the flow statistics of
# /opt/ofb/tix/runs/wd2 @ 4250. Changes (bounds only widened):
#   dt_range: tau_cell p1 1.1e-05 s .. p99.5 0.000845 s (p50 7.9e-05 s)
#   envelope.u_knots: hot-gas mass per Z interval [0.869, 0.065, 0.042, 0.019, 0.005] blended 50/50 with base [0.22, 0.18, 0.22, 0.18, 0.2]
#   pasr.burnt_relaxation.psi_max: psi p99.5 0.610
#   pasr.burnt_relaxation_lean.psi_min: 14.2 % of the hot mass has psi < -0.02 (excess enthalpy); p1 of lean hot gas -0.333
#   flame.mdot_fuel_min: chi_st p1 0.00912 1/s -> strain 0.369 1/s < base 0.6 1/s
#   pasr.burnt_relaxation.t_max: burnt-gas age p50 2.84e+03 s (capped at 0.2 s)
#   pasr.burnt_relaxation_lean.t_max: burnt-gas age p50 2.84e+03 s (capped at 0.2 s)
# No CFD state is used as training data; only the statistics above.

