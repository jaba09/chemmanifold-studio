# ChemManifold Studio pipeline configuration - the burner's non-premixed CH4/air flame (GA18).
# Every stage reads this file; all intermediate results live under `data_dir`.
#
# Streams and pressure follow the Fluent/OpenFOAM burner case (openfoam/quemadorUnico):
# pure CH4 at 300 K, air with Y_O2 = 0.21 BY MASS (as in the Fluent case) at 300 K, 1 atm.
# This gives Z_st = 0.050 and an adiabatic peak of 2120 K.
# The sampled space is the flame's: mixture fraction 0-1 (refined around Z_st), from the cold
# mixing line at 300 K up to the burnt (flamelet) state, with wall heat loss only (dh <= 0).

data_dir: data
seed: 0

chemistry:
  mechanism: mechanisms/ga18.yaml   # GA18: 18 species, 92 reactions (from the Fluent case)
  fuel: "CH4:1.0"                   # mass fractions
  fuel_T: 300.0
  oxidizer: "O2:0.21, N2:0.79"      # mass fractions, kept as in the Fluent case
  oxidizer_T: 300.0
  P_atm: 1.0

# Stage 0 - flame reference: counterflow flamelets from low strain to extinction
flame:
  transport: mixture-averaged       # closest to Fluent's kinetic-theory diffusivities | unity-Lewis-number
  width: 0.06                       # m, domain width of the lowest-strain flamelet
  mdot_fuel_min: 0.02               # kg/m^2/s at the fuel inlet (strain ~6 1/s)
  strain_factor: 1.5                # inlet mass flux multiplier between flamelets
  max_flamelets: 16
  extinction_T: 1000.0              # K, a flamelet below this peak is extinguished
  holdout_every: 3                  # flamelets 1, 4, 7, ... are kept out of training for stage 11

# Module 1 - ThermoExplorer (flame mode)
envelope:
  mode: flame
  n_traj: 96
  f_pasr: 0.35
  # Sobol u1 -> Z through a piecewise-linear CDF: 15% of seeds in Z < 0.025, 25% in 0.025-0.05,
  # 25% in 0.05-0.10, 20% in 0.10-0.20 and 15% in 0.20-1 (fuel-rich core, mostly mixing).
  z_knots: [0.0, 0.025, 0.05, 0.10, 0.20, 1.0]
  u_knots: [0.0, 0.15, 0.40, 0.65, 0.85, 1.0]
  alpha: [0.0, 1.0]                 # Sobol u2 -> burnt fraction of the seed state
  heat_loss_max: 1.2e+5             # J/kg; Sobol u3 -> dh = -u3 * heat_loss_max * alpha

autoignition:
  dt_base: 1.0e-5                   # s (10 us for CH4)
  t_max: 2.0e-2                     # s
  min_steps: 10
  dT_rise: 400.0                    # premixed mode only
  rise_frac: 0.9                    # flame mode: stop once 90% of the equilibrium rise is reached...
  dT_flat: 0.02                     # ...and |T_n - T_{n-1}| < dT_flat K
  n_consecutive: 25                 # ...for this many consecutive steps

arclength:
  boxcox_lambda: 0.10
  n_pick: 220
  n_seed: 15
  strides: [1, 2, 4]
  floor_frac: 0.05

pasr:
  n_particles: 400
  beta_a: 0.7
  beta_b: 0.7
  dh_range: [-1.2e+5, 0.0]          # J/kg; heat loss only (walls), no states hotter than adiabatic
  dh_scale_by_alpha: true           # the loss lives in the burnt part, so cold mixtures stay >= 300 K
  strides: [1, 2, 4]

# Module 2 - ManifoldPrep
preprocess:
  boxcox_lambda: 0.10
  val_frac: 0.12
  sigma_y_min: 1.0e-3
  sigma_dy_min: 1.0e-2

manifold:
  n_clusters: 4
  candidate_dims: [2, 3, 4, 6, 8]
  variance_target: 0.995
  max_samples: 40000

# Coverage check of the sampled data against the flamelet states (stage 11)
coverage:
  radius: 0.5                       # a flame state is covered if a sampled state lies within this
                                    # distance (in per-variable standard deviations, all species + T)

# Module 3/4 - Surrogates & training
model:
  hidden: 192
  n_blocks: 3
  node_hidden: 128
  node_substeps: 2
  latent_dim: auto

training:
  epochs: 300
  batch_size: 512
  lr_max: 2.0e-3
  weight_decay: 1.0e-5
  noise_amp: 0.015
  noise_end_frac: 0.85
  loss_weights: {inc: 1.0, mass: 1.0, T: 1.0, equil: 0.1, ae: 1.0}
  equil_threshold: 0.05
  threads: 4                        # CPU threads; 4 = the performance cores of an M1/M2 MacBook Air ('auto' = torch default)
  device: auto                      # auto (CPU, or CUDA if present) | cpu | mps | cuda

# Module 5 - Certification (flame mode: cases are seed states (Z, alpha) at 1 atm)
evaluation:
  rollout:                          # Z_st, 60% burnt: ignites after ~0.47 ms, reaches ~2120 K
    Z: 0.05
    alpha: 0.6
    n_steps: 500                    # 5 ms at dt_base
    stride: 1
  envelope_grid:                    # lean / stoichiometric / rich seeds that ignite within 5 ms
    Z: [0.03, 0.05, 0.08]
    alpha: [0.6, 0.7, 0.8]
