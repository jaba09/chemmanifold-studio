# Options of the ARC22 chemistry UDF. Optional: put this file in Fluent's working folder (next to the
# case) and, after changing it, run arc22_reload under User-Defined > Execute On Demand.
rtol = 1e-4          # relative tolerance of the integrator (OpenFOAM ARC run: 1e-4)
atol = 1e-9          # absolute tolerance on mass fractions (OpenFOAM ARC run: 1e-9)
atol_T = 1e-3        # absolute tolerance on temperature, K
T_freeze = 200       # K; colder cells are not advanced (Fluent GRI case: minimum chemistry T 200 K)
T_quiet = 500        # K; below this, a cell whose change over dt is <1% of the tolerance gets one explicit step
method = 1           # 1 = ROS34PW2 with Jacobian reuse (fast, default); 0 = ROS4, new Jacobian every step
jac_reuse = 8        # ROS34PW2: steps per Jacobian at most
project = 1          # element projection onto CO2/H2O/O2/N2 after each call (as the OpenFOAM ARC run)
write_udm = 1        # fill UDM 0-2 (heat release, steps, element fix) when 3 UDMs are allocated
log = arc22_monitor.csv
verbose = 0          # 1 prints failed cells, 2 prints every cell (debugging only)
