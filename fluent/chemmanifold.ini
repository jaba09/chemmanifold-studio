# ChemManifold UDF options. Keep this file in Fluent's working folder, next to the model file.
# After changing it, run chemmanifold_reload (User-Defined > Execute On Demand).
model = chemmanifold_model.txt     # ResNet-FiLM exported from configs/burner_fluent_air.yaml
tests = chemmanifold_tests.txt
log = chemmanifold_monitor.csv     # one row per iteration
T_freeze = 600                     # K; colder cells are not advanced
max_substeps = 50                  # 50 x 40 us = 2 ms of chemistry per call at most
ood_action = 0                     # 0 = only flag cells outside the training data
check_ood = 1
write_udm = 1
verbose = 0
